# Stack do recurso `waha` (colar num Service "Docker Compose Empty", por ambiente).
# Engine GOWS = deploy oficial sem browser (devlikeapro/waha:gows).
# Coolify: ativar "Connect To Predefined Network" para juntar esta stack à
# rede `coolify` (sem isso, o core não resolve o hostname interno em F1).

services:
  waha:
    image: devlikeapro/waha:gows
    restart: unless-stopped
    environment:
      WHATSAPP_DEFAULT_ENGINE: GOWS
      WAHA_API_KEY: ${WAHA_API_KEY:?defina WAHA_API_KEY no ambiente}
      WAHA_API_KEY_EXCLUDE_PATH: health,ping
      WAHA_DASHBOARD_USERNAME: ${WAHA_DASHBOARD_USERNAME:-admin}
      WAHA_DASHBOARD_PASSWORD: ${WAHA_DASHBOARD_PASSWORD:?defina WAHA_DASHBOARD_PASSWORD no ambiente}
      WAHA_LOG_LEVEL: ${WAHA_LOG_LEVEL:-info}
      # Redis "full capabilities": filas/jobs em background do WAHA.
      REDIS_URL: ${REDIS_URL:?defina REDIS_URL (mesma do core)}
      # Webhook → core (intake normalizado, idempotente).
      WAHA_HOOK_URL: ${WAHA_HOOK_URL:-http://core:3000/webhooks/waha}
      WAHA_HOOK_EVENTS: ${WAHA_HOOK_EVENTS:-message,session.status}
      WAHA_HOOK_RETRIES_POLICY: ${WAHA_HOOK_RETRIES_POLICY:-linear}
    volumes:
      - waha-data:/app/.sessions

volumes:
  waha-data:
