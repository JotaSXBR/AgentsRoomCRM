# Redis — colar em "Custom Redis configuration" do Database gerenciado.
# (Também usado pelo `coolify/local/docker-compose.yml`.)
# Endurecimento com senha: no recurso gerenciado (REDIS_URL com senha no core).
# AOF + limite 256 MB `noeviction`: nunca despejar silenciosamente.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistência (o volume do recurso guarda /data).
appendonly yes
appendfilename "appendonly.aof"
save 60 1000

# Cache operacional (filas, sessões, rate-limit): erro em vez de despejo.
maxmemory 256mb
maxmemory-policy noeviction

# Logs enxutos no Coolify.
loglevel notice
